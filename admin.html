<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | NAVAMI S</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="admin-container">

        <h1>NAVAMI S</h1>
        <h2>ADMIN DASHBOARD</h2>

        <div id="login-section">
            <h3>Admin Login</h3>

            <input type="email" id="admin-email"
                   placeholder="Email address">

            <input type="password" id="admin-password"
                   placeholder="Password">

            <button id="login-button">LOGIN</button>

            <p id="login-message"></p>
        </div>

        <div id="dashboard-section" style="display:none;">
            <h3>Welcome, Admin!</h3>

            <button id="logout-button">LOGOUT</button>

            <h3>Add Certificate</h3>

            <input type="text" id="cert-title"
                   placeholder="Certificate title">

            <input type="text" id="cert-category"
                   placeholder="Category">

            <input type="text" id="cert-organization"
                   placeholder="Organization">

            <input type="text" id="cert-result"
                   placeholder="Result">

            <input type="number" id="cert-score"
                   placeholder="Score">

            <input type="date" id="cert-date">

            <button id="add-certificate-button">
                ADD CERTIFICATE
            </button>

            <p id="certificate-message"></p>
        </div>

    </div>

    <script type="module" src="admin.js"></script>

</body>
</html>
